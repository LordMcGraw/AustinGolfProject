# Courses the checker watches. `platform` picks the reader in golfbooker/readers.
# Coordinates are approximate and only used to pull the weather forecast.
# `notes` show on the dashboard next to each course.

courses:
  # City of Austin munis book through the city's WebTrac tee sheet (Golf ATX).
  - id: lions
    name: Lions Municipal
    platform: golfnow
    golfnow_facility: 834
    lat: 30.2873
    lon: -97.7745
    booking_url: https://txaustinweb.myvscloud.com/webtrac/web/search.html?display=detail&module=GR
    notes: City muni. Checked on GolfNow only, which gets few or none of its times; the full tee sheet is on the city site. Weekend times open Monday 8 pm, online only. One tee time (up to 4 players) per account.
