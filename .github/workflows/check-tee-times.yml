name: Check tee times

on:
  schedule:
    - cron: "*/15 * * * *"  # GitHub may start scheduled runs a few minutes late
  workflow_dispatch:
    inputs:
      test_email:
        description: Send a test alert email with a few current matches
        type: boolean
        default: false

concurrency:
  group: check-tee-times
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Remember which tee times were already emailed, across runs.
      - name: Restore alert history
        uses: actions/cache/restore@v4
        with:
          path: state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Check courses
        env:
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TEST_EMAIL: ${{ inputs.test_email && '--test-email' || '' }}
        run: python -m golfbooker.run $TEST_EMAIL

      - name: Save alert history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: alert-state-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
